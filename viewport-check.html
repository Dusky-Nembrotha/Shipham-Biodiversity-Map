<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viewport check</title>
<style>
  html,body{margin:0;height:100%}
  body{font:15px/1.5 system-ui,sans-serif;background:#FBFAF6;color:#1E2A23;
       overflow:hidden;position:relative;height:100vh;height:100dvh}
  /* A — how the map is built NOW: fixed, resolved against the viewport */
  #boxA{position:fixed;inset:0;border:7px solid #1B7F4B;background:rgba(27,127,75,.07)}
  /* B — how the map was built BEFORE: absolute, resolved against <body> */
  #boxB{position:absolute;inset:0;border:7px dashed #D81B83;background:rgba(216,27,131,.05)}
  #out{position:fixed;inset:34px;padding:16px 18px;overflow:auto;
       background:rgba(255,255,255,.93);border-radius:12px}
  h1{font:600 18px/1.3 system-ui;margin:0 0 8px}
  pre{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;margin:0}
  button{font:600 15px system-ui;padding:10px 16px;border-radius:9px;border:1px solid #ccc;background:#fff;margin-top:12px}
  .k{display:inline-block;width:12px;height:12px;vertical-align:-1px;border-radius:3px}
</style>
</head>
<body>
<div id="boxB"></div>
<div id="boxA"></div>
<div id="out">
  <h1>Viewport check</h1>
  <p style="max-width:42em;margin:0 0 10px">
    <span class="k" style="background:#1B7F4B"></span> <b>Green solid</b> = how the map is built now.<br>
    <span class="k" style="background:#D81B83"></span> <b>Pink dashed</b> = how it was built before.<br>
    If the green reaches all four edges and the pink does not, the fix is correct.</p>
  <pre id="n">measuring…</pre>
  <button onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('n').textContent).then(()=>alert('Copied'))">Copy numbers</button>
</div>
<script>
function measure(){
  var d=document.documentElement,b=document.body,vv=window.visualViewport;
  var A=document.getElementById("boxA").getBoundingClientRect();
  var B=document.getElementById("boxB").getBoundingClientRect();
  var cs=getComputedStyle(b);
  var L=[
    ["window.inner",            innerWidth+" x "+innerHeight],
    ["documentElement.client",  d.clientWidth+" x "+d.clientHeight],
    ["body.offset",             b.offsetWidth+" x "+b.offsetHeight],
    ["body computed size",      cs.width+" x "+cs.height],
    ["GREEN fixed box",         Math.round(A.width)+" x "+Math.round(A.height)],
    ["PINK  body-relative box", Math.round(B.width)+" x "+Math.round(B.height)],
    ["visualViewport",          vv? Math.round(vv.width)+" x "+Math.round(vv.height)+" scale="+vv.scale : "n/a"],
    ["screen / avail",          screen.width+"x"+screen.height+" / "+screen.availWidth+"x"+screen.availHeight],
    ["devicePixelRatio",        devicePixelRatio],
    ["VERDICT",                 (Math.abs(A.width-innerWidth)<3&&Math.abs(A.height-innerHeight)<3)
                                 ? "green fills the window — fix works" : "green is SHORT — still broken"]
  ];
  document.getElementById("n").textContent=L.map(function(r){
    return (r[0]+"                         ").slice(0,26)+" : "+r[1];}).join("\n");
}
measure(); addEventListener("resize",measure);
if(window.visualViewport) visualViewport.addEventListener("resize",measure);
</script>
</body>
</html>
