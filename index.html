<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Shipham Parish Maps</title>
<meta name="description" content="Community maps of Shipham parish, Somerset: biodiversity, landscape and heritage, geology, history and parish assets." />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#FBFAF6; --stone:#F1ECE1; --ink:#1E2A23; --muted:#5B6A60;
    --moss:#2F5D3A; --sage:#6E8B5B; --slate:#3E7CA8; --gorse:#E0A52E;
    --heather:#8E4A77; --heather-dk:#763D63; --line:#E2DCCF;
    --shadow:0 6px 24px rgba(30,42,35,.16); --radius:16px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  /* Stop any inherited max-width/height from distorting Leaflet's tiles, markers
     and vector SVG — a common cause of layers scaling/drifting wrong on zoom. */
  .leaflet-container img,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-tile,
  .leaflet-marker-icon,.leaflet-image-layer{max-width:none!important;max-height:none!important}
  html,body{height:100%;margin:0}
  body{font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);
    background:var(--paper);overflow:hidden;-webkit-tap-highlight-color:transparent}
  #map{position:fixed;inset:0;background:#aab9b1}

  .brand{position:fixed;top:14px;left:14px;z-index:1000;background:rgba(251,250,246,.94);
    backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:10px 14px;max-width:min(78vw,300px)}
  .brand__head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;cursor:pointer;user-select:none}
  .brand h1{font-family:"Fraunces",serif;font-weight:600;font-size:1.18rem;margin:0;line-height:1.06;
    letter-spacing:-.01em;color:var(--moss)}
  .brand h1 .leaf{color:var(--heather)}
  .brand__chev{transition:transform .25s ease;color:var(--muted);font-size:.8rem;margin-top:3px}
  .brand.collapsed .brand__chev{transform:rotate(-90deg)}
  .brand.collapsed .brand__body{display:none}
  .brand__body{margin-top:8px;max-height:calc(100vh - 215px);overflow:auto}
  .brand__img{width:100%;max-height:200px;object-fit:contain;border-radius:10px;display:block;border:1px solid var(--line);background:#fff}
  .showcase{margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .showcase .sc-head{grid-column:1/-1;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:1px}
  .showcase a{display:block;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;transition:transform .12s,box-shadow .12s}
  .showcase a:hover{transform:translateY(-1px);box-shadow:0 3px 9px rgba(0,0,0,.13)}
  .showcase img{width:100%;height:64px;object-fit:cover;display:block;background:#eee}
  .showcase .sc-txt{padding:4px 7px 6px}
  .showcase .sc-sp{font-size:.71rem;font-weight:600;line-height:1.15;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .showcase .sc-by{font-size:.6rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:1px}
  @media (min-width:900px){
    .brand{max-width:380px}
    .showcase{gap:9px}
    .showcase img{height:104px}
    .showcase .sc-sp{font-size:.78rem}
    .showcase .sc-by{font-size:.66rem}
  }
  @media (min-width:1400px){
    .brand{max-width:440px}
    .showcase img{height:124px}
  }
  .proj-label{background:rgba(255,255,255,.92);border:1.5px solid #1565C0;color:#0d3c78;font-weight:700;font-size:.68rem;padding:1px 7px;border-radius:8px;box-shadow:0 1px 4px rgba(0,0,0,.25);white-space:nowrap}
  .proj-label.leaflet-tooltip-top::before,.proj-label.leaflet-tooltip-bottom::before,.proj-label.leaflet-tooltip-left::before,.proj-label.leaflet-tooltip-right::before{display:none}
  .brand p{margin:.5rem 0 0;font-size:.77rem;color:var(--muted);line-height:1.3}

  .panel{position:fixed;top:14px;right:14px;z-index:1000;width:272px;max-width:calc(100vw - 28px);
    background:rgba(251,250,246,.96);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .panel__head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 14px;
    cursor:pointer;user-select:none}
  .panel__head h2{font-family:"Fraunces",serif;font-weight:600;font-size:.96rem;margin:0}
  .panel__chev{transition:transform .25s ease;color:var(--muted);font-size:.8rem}
  .panel.collapsed .panel__chev{transform:rotate(-90deg)}
  .panel__body{padding:2px 10px 10px;max-height:calc(100vh - 150px);overflow:auto}
  .panel.collapsed .panel__body{display:none}

  .layer{display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:11px;cursor:pointer}
  .layer:hover{background:var(--stone)}
  .layer input{margin:3px 0 0;width:17px;height:17px;accent-color:var(--moss);flex:0 0 auto;cursor:pointer}
  .swatch{width:14px;height:14px;border-radius:4px;margin-top:2px;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}
  .swatch.line{border-radius:2px;height:0;border:0;border-top:3px dashed var(--heather);width:15px;margin-top:8px}
  .layer__txt{flex:1;min-width:0}
  .layer__txt b{display:block;font-size:.85rem;font-weight:600;line-height:1.15}
  .layer__txt small{display:block;color:var(--muted);font-size:.72rem;margin-top:1px}
  .count{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}

  .basemap{margin:8px 8px 2px;border-top:1px solid var(--line);padding-top:10px}
  .basemap small{display:block;font-size:.68rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
  .basemap .row{display:flex;flex-wrap:wrap;gap:6px}
  .basemap button{flex:1 1 30%;min-width:74px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 4px;
    border-radius:9px;font-size:.74rem;font-weight:600;cursor:pointer;font-family:inherit}
  .basemap button.active{background:var(--moss);color:#fff;border-color:var(--moss)}

  .fab{position:fixed;right:16px;bottom:calc(30px + env(safe-area-inset-bottom,0px));z-index:1000;display:inline-flex;align-items:center;gap:9px;
    background:#1565C0;color:#fff;border:none;cursor:pointer;font-family:inherit;font-weight:600;
    font-size:.95rem;padding:14px 20px;border-radius:999px;box-shadow:var(--shadow);
    transition:transform .15s ease, background .15s ease}
  .fab:hover{background:#0D47A1;transform:translateY(-1px)}
  .fab svg{width:18px;height:18px}

  .hint{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:1200;background:var(--ink);
    color:#fff;padding:10px 14px;border-radius:16px;font-size:.82rem;font-weight:500;box-shadow:var(--shadow);
    display:none;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;
    width:max-content;max-width:min(92vw,440px);text-align:center}
  .hint.show{display:flex}
  .hint span{flex-basis:100%}
  .hint button{background:rgba(255,255,255,.16);border:none;color:#fff;border-radius:999px;padding:5px 14px;
    font-size:.8rem;cursor:pointer;font-family:inherit}
  #xhair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1100;display:none;
    pointer-events:none;filter:drop-shadow(0 0 2px rgba(255,255,255,.95))}
  #xhair.show{display:block}
  @media (max-width:560px){ .leaflet-draw-tooltip{display:none} }

  .scrim{position:fixed;inset:0;background:rgba(20,30,24,.32);z-index:1500;opacity:0;pointer-events:none;
    transition:opacity .25s ease}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;bottom:0;right:0;width:380px;max-width:100vw;z-index:1600;
    background:var(--paper);box-shadow:-8px 0 30px rgba(20,30,24,.18);transform:translateX(100%);visibility:hidden;
    transition:transform .3s cubic-bezier(.4,0,.2,1),visibility 0s linear .3s;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0);visibility:visible;transition:transform .3s cubic-bezier(.4,0,.2,1),visibility 0s linear 0s}
  .drawer__head{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
  .drawer__head h2{font-family:"Fraunces",serif;font-weight:600;font-size:1.2rem;margin:0;color:var(--moss)}
  .drawer__head p{margin:.3rem 0 0;font-size:.8rem;color:var(--muted)}
  .steps{display:flex;gap:14px;margin-top:12px}
  .step{display:flex;gap:7px;align-items:center;font-size:.74rem;color:var(--muted)}
  .step b{display:grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--stone);
    color:var(--ink);font-size:.7rem;font-weight:700}
  .step.done b{background:var(--moss);color:#fff}
  .drawer__body{padding:16px 20px;overflow:auto;flex:1}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px}
  .field .req{color:var(--heather)}
  .field input[type=text], .field textarea{width:100%;border:1px solid var(--line);border-radius:10px;
    padding:11px 12px;font-family:inherit;font-size:.9rem;background:#fff;color:var(--ink);resize:vertical}
  .field input:focus, .field textarea:focus{outline:2px solid var(--sage);outline-offset:1px;border-color:var(--sage)}
  .field textarea{min-height:92px}
  .photo-drop{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;cursor:pointer;
    background:#fff;color:var(--muted);font-size:.83rem}
  .photo-drop:hover{border-color:var(--sage);color:var(--ink)}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .thumbs figure{position:relative;margin:0}
  .thumbs img{width:64px;height:64px;object-fit:cover;border-radius:9px;display:block;border:1px solid var(--line)}
  .thumbs button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:none;
    background:var(--ink);color:#fff;font-size:.7rem;cursor:pointer;line-height:1}
  .drawer__foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px}
  .btn{flex:1;border-radius:11px;padding:13px;font-family:inherit;font-weight:600;font-size:.92rem;cursor:pointer;
    border:1px solid var(--line)}
  .btn--ghost{background:#fff;color:var(--ink)}
  .btn--primary{background:var(--heather);color:#fff;border-color:var(--heather)}
  .btn--primary:disabled{opacity:.55;cursor:not-allowed}
  .note{font-size:.74rem;color:var(--muted);background:var(--stone);border-radius:10px;padding:10px 12px;
    margin-top:4px;line-height:1.4}

  .leaflet-popup-content-wrapper{border-radius:14px}
  .leaflet-popup-content{margin:13px 15px;font-family:inherit;width:230px!important;overflow-wrap:anywhere}
  .pop h3{font-family:"Fraunces",serif;font-weight:600;margin:0 0 5px;font-size:1.02rem;color:var(--moss);line-height:1.1;overflow-wrap:anywhere}
  .pop .tag{display:inline-block;font-size:.64rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    padding:2px 8px;border-radius:999px;margin-bottom:7px}
  .pop p{margin:0 0 7px;font-size:.83rem;line-height:1.42;overflow-wrap:anywhere}
  .pop .by{font-size:.73rem;color:var(--muted)}
  .pop .pop-hero{width:100%;height:120px;object-fit:cover;border-radius:9px;margin:0 0 8px;display:block}
  .pop .photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pop .photos a img{width:62px;height:62px;object-fit:cover;border-radius:8px;display:block}
  .pop a.link{color:var(--slate);font-size:.78rem;text-decoration:none;font-weight:600}
  .pop p a.desc-link{color:var(--muted);text-decoration:underline;text-decoration-color:var(--line);
    text-underline-offset:2px;word-break:break-all}
  .pop p a.desc-link:hover{color:var(--ink);text-decoration-color:var(--muted)}
  .popbtns{display:flex;gap:8px;margin-top:11px}
  .popbtn{flex:1;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px;
    font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
  .popbtn:hover{background:var(--stone)}
  .popbtn.danger{color:#B3261E;border-color:#eec4c0}
  .pop .loading{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:7px}
  .spin{width:13px;height:13px;border:2px solid var(--line);border-top-color:var(--sage);border-radius:50%;
    animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .place-label{background:transparent;border:none;box-shadow:none;color:#fff;font-weight:700;font-size:.78rem;
    text-shadow:0 1px 3px rgba(0,0,0,.9),0 0 2px rgba(0,0,0,.8);padding:0}
  .place-label::before{display:none}

  .toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(10px);z-index:2000;
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:.85rem;opacity:0;
    pointer-events:none;transition:all .25s ease;box-shadow:var(--shadow);max-width:84vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .leaflet-control-attribution{font-size:10px}

  .loadfail{padding:28px;font-family:Inter,system-ui,sans-serif;color:#1E2A23;max-width:430px;margin:60px auto;text-align:center}
  .loadfail h2{font-family:Fraunces,serif}

  @media (max-width:560px){
    .brand{max-width:62vw;padding:10px 13px}
    .brand h1{font-size:1.05rem}
    .panel{width:236px;top:auto;bottom:84px;right:14px}
    .panel__body{max-height:42vh}
    .drawer{width:100%}
  }
  /* Licence conditions mean every credit has to stay readable, so this is made small
     and quiet rather than truncated. */
  .leaflet-control-attribution{font-size:9.5px!important;line-height:1.35;
    background:rgba(251,250,246,.72)!important;color:#7d8a81;padding:1px 6px;
    border-radius:6px 0 0 0;max-width:72vw}
  .leaflet-control-attribution a{color:#6b7a70;text-decoration:none}
  .leaflet-control-attribution a:hover{text-decoration:underline}
  @media (max-width:760px){
    .leaflet-control-attribution{font-size:8.5px!important;max-width:100vw;opacity:.85}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* ================= Map switcher ================= */
  .mapswitch{position:fixed;top:14px;left:14px;z-index:1200;display:flex;align-items:center;gap:8px;
    background:rgba(251,250,246,.95);backdrop-filter:blur(6px);border:1px solid var(--line);
    border-radius:12px;padding:7px 10px;box-shadow:var(--shadow);max-width:calc(100vw - 28px)}
  .mapswitch__lbl{font-size:.63rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);flex:none}
  .mapswitch__btns{display:flex;flex-wrap:wrap;gap:5px}
  .mapswitch__btns button{border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:6px 11px;border-radius:999px;font:600 .76rem/1 inherit;font-family:inherit;cursor:pointer;
    white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
  .mapswitch__btns button:hover{border-color:var(--g,#2F5D3A)}
  .mapswitch__btns button.active{background:var(--g,#2F5D3A);border-color:var(--g,#2F5D3A);color:#fff}
  .mapswitch__sel{display:none;font-family:inherit;font-size:.84rem;font-weight:600;color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:7px 9px;background:#fff;max-width:54vw}
  /* Mobile: just the map, the chooser and the layer list. The title card, the "Map"
     label and the zoom buttons all go — there is pinch-to-zoom for the last of those. */
  @media (max-width:760px){
    .mapswitch__btns{display:none}
    .mapswitch__sel{display:block;max-width:min(58vw,240px)}
    .mapswitch__lbl{display:none}
    .brand{display:none!important}
    .leaflet-control-zoom{display:none}
    /* The chooser and the layer list sit flush against the top edge, meeting in the
       middle so they read as one header strip. */
    .mapswitch{top:0;left:0;padding:7px 10px;border-width:0 1px 1px 0;
      border-radius:0 0 13px 0;box-shadow:0 2px 12px rgba(30,42,35,.14)}
    .panel{top:0;right:0;left:auto;bottom:auto;width:auto;max-width:44vw;
      border-width:0 0 1px 1px;border-radius:0 0 0 13px;
      box-shadow:0 2px 12px rgba(30,42,35,.14)}
    .panel__head{padding:9px 11px}
    .panel__head h2{font-size:.8rem}
    .panel.collapsed{max-width:44vw}
    .panel:not(.collapsed){max-width:min(92vw,330px)}
    .panel__body{max-height:62vh}
  }

  /* ================= Group chrome on the map ================= */
  .brand{top:60px}
  .grpTag{display:inline-block;font-size:.63rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
    color:#fff;background:var(--g,#2F5D3A);padding:3px 8px;border-radius:999px;margin-bottom:7px}
  .layer__txt small .count{color:var(--muted)}
  .panel__body .lyrgroup{font-size:.63rem;font-weight:800;letter-spacing:.055em;text-transform:uppercase;
    color:var(--muted);margin:9px 0 3px 8px}
  .panel__body .lyrgroup:first-child{margin-top:2px}
  .spin-sm{display:inline-block;width:9px;height:9px;border:2px solid var(--line);border-top-color:var(--moss);
    border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}
  .sidebox{margin-top:10px;border-top:1px solid var(--line);padding-top:9px}
  .sidebox h3{font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:.72rem;font-weight:700;line-height:1.3;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px}
  .sidelist{display:grid;gap:4px;max-height:210px;overflow:auto}
  .sidelist button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;
    border-radius:8px;padding:6px 8px;font:inherit;font-size:.76rem;cursor:pointer;color:inherit;line-height:1.25}
  .sidelist button:hover{border-color:var(--moss);background:#F7FAF6}
  .sidelist .m{display:block;font-size:.65rem;color:var(--muted);margin-top:1px}
</style>
</head>
<body>

<div id="map"></div>

<div class="mapswitch" id="mapswitch">
  <span class="mapswitch__lbl">Map</span>
  <div class="mapswitch__btns" id="switchBtns"></div>
  <select class="mapswitch__sel" id="switchSel" aria-label="Choose a map"></select>
</div>

<div class="brand" id="brand" hidden>
  <div class="brand__head" id="brandHead" role="button" tabindex="0" aria-expanded="true">
    <div><span class="grpTag" id="grpTag"></span><h1 id="grpTitle">Shipham</h1></div>
    <span class="brand__chev">▾</span>
  </div>
  <div class="brand__body">
    <img class="brand__img" id="brandImg" src="shipham-aerial.jpg" alt="Shipham from the air" hidden
         onerror="this.dataset.failed='1';this.hidden=true">
    <p id="grpBlurb"></p>
    <div id="showcase" class="showcase" hidden></div>
    <div id="sidebox" class="sidebox" hidden>
      <h3 id="sideboxTitle">Highlights</h3>
      <div class="sidelist" id="sidelist"></div>
    </div>
  </div>
</div>

<aside class="panel" id="panel" aria-label="Map layers" hidden>
  <div class="panel__head" id="panelHead" role="button" tabindex="0" aria-expanded="true">
    <h2>What's on the map</h2><span class="panel__chev">▾</span>
  </div>
  <div class="panel__body" id="panelBody"></div>
</aside>


<div class="hint" id="hint">
  <span>Aim the crosshair, tap “Add point”. One point = a single spot; 3+ = an area.</span>
  <button id="hintAdd">Add point</button>
  <button id="hintUndo">Undo</button>
  <button id="hintFinish">Finish</button>
  <button id="hintCancel">Cancel</button>
</div>
<div id="xhair" aria-hidden="true"><svg width="46" height="46" viewBox="0 0 46 46">
  <circle cx="23" cy="23" r="10" fill="none" stroke="#1565C0" stroke-width="2.5"/>
  <line x1="23" y1="1" x2="23" y2="13" stroke="#1565C0" stroke-width="2.5"/>
  <line x1="23" y1="33" x2="23" y2="45" stroke="#1565C0" stroke-width="2.5"/>
  <line x1="1" y1="23" x2="13" y2="23" stroke="#1565C0" stroke-width="2.5"/>
  <line x1="33" y1="23" x2="45" y2="23" stroke="#1565C0" stroke-width="2.5"/>
  <circle cx="23" cy="23" r="2.5" fill="#1565C0"/>
</svg></div>

<button class="fab" id="addBtn" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  Add your project
</button>

</form>

<div class="toast" id="toast"></div>
<script>
function initApp(){
/* =================================================================
   CONFIG — the only part you normally need to edit. See README.md.
================================================================= */
const OS_API_KEY        = "2dSIGJBjO8WVJuFxhgWj1tvnAQhCXDy8";  // OS Data Hub key → OS base map
const MAPTILER_KEY      = "V6mUPHc6MgzfhbknA10X";              // sharper satellite (falls back to Esri)
const APPS_SCRIPT_URL   = "https://script.google.com/macros/s/AKfycbzyBmfJVVTEjpoS68ioa_TQDgC3RtBnchsPq7vjPt1yTZUHK9rNB46wc3aQaQUhX1li9g/exec";
const SHIPHAM = { lat:51.3138, lng:-2.7987, zoom:14 };
const DATA    = "layers/";          // every vector layer is a GeoJSON file in this folder
/* ================================================================= */

const gasReady = /^https:\/\/script\.google\.com\/.+\/exec$/.test(APPS_SCRIPT_URL);
const backendReady = gasReady;
const osReady = OS_API_KEY && !OS_API_KEY.includes("YOUR_");
const mtReady = MAPTILER_KEY && !MAPTILER_KEY.includes("YOUR_");

/* ---------- Small helpers ---------- */
const ENT={"&amp;":"&","&lt;":"<","&gt;":">","&quot;":'"',"&#39;":"'","&apos;":"'","&nbsp;":" "};
const deent = s => String(s==null?"":s).replace(/&(amp|lt|gt|quot|#39|apos|nbsp);/g,m=>ENT[m]);
const esc = s => deent(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const URL_RE = /\b((?:https?:\/\/|www\.)[^\s<]+[^\s<.,;:!?)\]'"])/gi;
const linkify = s => esc(s).replace(URL_RE, m=>{
  const href = m.startsWith("www.") ? "https://"+m : m;
  return `<a href="${href}" target="_blank" rel="noopener">${m}</a>`;
});
const bboxQS = b => `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()}`;
const setCount = (id,n)=>{ const el=document.getElementById(id); if(el) el.textContent = n==null?"":"· "+n; };
const tidyName = s => /[a-z]/.test(String(s)) ? String(s)
  : String(s).toLowerCase().replace(/\b[a-z]/g, c=>c.toUpperCase());   // "SLADERS LEIGH" → "Sladers Leigh"
function pickName(p){ for(const k in p){ if(/(sssi|lnr).*name|^name$|^par\d*nm$/i.test(k) && p[k]) return tidyName(p[k]); }
  for(const k of ["SSSI_NAME","LNR_NAME","NAME","Name","name"]) if(p[k]) return tidyName(p[k]); return "Unnamed site"; }

/* ---------- Map ---------- */
const map = L.map("map", { zoomControl:false, maxZoom:20, preferCanvas:true })
             .setView([SHIPHAM.lat, SHIPHAM.lng], SHIPHAM.zoom);
L.control.zoom({ position:"bottomleft" }).addTo(map);
window.__map = map;   // for ?debug=1 measurements
/* Keep the map filling the window after a rotate, a window resize, or the on-screen
   keyboard opening. Leaflet watches window resize itself but not visualViewport. */
const refitMap = () => map.invalidateSize({pan:false});
addEventListener("orientationchange", ()=>setTimeout(refitMap,200));
if(window.visualViewport) visualViewport.addEventListener("resize", refitMap);

/* Background panes, below the default overlayPane (400) used by points and lines. */
map.createPane("fillPane"); map.getPane("fillPane").style.zIndex = 350;   // habitat washes
map.createPane("wmsPane");  map.getPane("wmsPane").style.zIndex  = 360;   // raster overlays
map.createPane("areaPane"); map.getPane("areaPane").style.zIndex = 380;   // designation outlines
map.createPane("linePane"); map.getPane("linePane").style.zIndex = 420;   // lines and points, always clickable

/* ---------- Base maps ---------- */
const satLayer = mtReady
  ? L.tileLayer(`https://api.maptiler.com/maps/satellite/256/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`,
      { maxZoom:20, attribution:"Imagery &copy; MapTiler, Esri" })
  : L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      { maxZoom:20, maxNativeZoom:19, attribution:"Imagery &copy; Esri" });
const osOutdoor = osReady ? L.tileLayer(`https://api.os.uk/maps/raster/v1/zxy/Outdoor_3857/{z}/{x}/{y}.png?key=${OS_API_KEY}`,
      { maxZoom:20, attribution:"Contains OS data &copy; Crown copyright &amp; database right" }) : null;
/* Place-name labels to sit over imagery and hillshade. CARTO's keyless raster tiles
   now return an "API KEY REQUIRED" watermark with HTTP 200, so this uses Esri's
   keyless reference layer instead. */
const labels = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
      { maxZoom:20, maxNativeZoom:19, attribution:"Labels &copy; Esri" });
const lidarLayer = L.tileLayer.wms(
  "https://environment.data.gov.uk/spatialdata/lidar-composite-digital-terrain-model-dtm-1m/wms",
  { layers:"Lidar_Composite_Hillshade_DTM_1m", format:"image/png", transparent:false,
    version:"1.1.1", maxZoom:20, attribution:"LIDAR DTM hillshade &copy; Environment Agency (OGL v3)" });
const nlsLayer = L.tileLayer("https://mapseries-tilesets.s3.amazonaws.com/25_inch/somerset/{z}/{x}/{y}.png",
  { maxZoom:20, maxNativeZoom:20, attribution:"Historical OS 25-inch &copy; National Library of Scotland (CC-BY)" });
const plainLayer = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  { maxZoom:19, attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' });

const BASES = {
  satos:  { label:"Satellite + OS", build:()=> osReady ? [satLayer, osOutdoor] : [satLayer, labels] },
  os:     { label:"OS map",         build:()=> osReady ? [osOutdoor] : [plainLayer] },
  sat:    { label:"Satellite",      build:()=> [satLayer, labels] },
  lidar:  { label:"LiDAR terrain",  build:()=> [lidarLayer, labels] },
  nls:    { label:"Old OS (1880s)", build:()=> [nlsLayer] },
  plain:  { label:"Plain map",      build:()=> [plainLayer] }
};
let currentBase = [];
function setBase(mode){
  currentBase.forEach(l=>{ if(l) map.removeLayer(l); });
  const b = BASES[mode] || BASES.satos;
  currentBase = b.build().filter(Boolean);
  currentBase.forEach((l,i)=>{ l.setZIndex(i+1); l.addTo(map); });
  document.querySelectorAll("[data-base]").forEach(el=>el.classList.toggle("active", el.dataset.base===mode));
  if(osReady && mode==="os") osOutdoor.setOpacity(1);
}

/* ---------- Shared feature layers ---------- */
const parishGroup = L.layerGroup();
const inatCluster = L.markerClusterGroup({ maxClusterRadius:45, showCoverageOnHover:false });
let inatTiles = null;
const projLayer = L.geoJSON(null, { pane:"linePane",
  style:()=>({color:"#1565C0",weight:2.5,fillColor:"#2196F3",fillOpacity:.28}),
  pointToLayer:(f,ll)=>L.circleMarker(ll,{radius:8,color:"#fff",weight:2,fillColor:"#1565C0",fillOpacity:1}),
  onEachFeature:(f,l)=>{ l._projData=f.properties; if(f.properties.id) projectLayers[f.properties.id]=l;
    l.bindPopup(projectPopup(f.properties));
    if(f.properties.name){ const isPt=f.geometry&&f.geometry.type==="Point";
      l.bindTooltip(esc(f.properties.name),{permanent:true,direction:isPt?"top":"center",
        className:"proj-label",offset:isPt?[0,-11]:[0,0]}); } } });
let PARISH_BB = null;          // [W,S,E,N] of the parish, used to query iNaturalist
let parishFeature = null;

const seen = { inat:new Set() };
/* ---------- Designation popups (photo + info via Wikipedia) ---------- */
function bindDesignation(f,l,kind,colour){
  const name=pickName(f.properties||{});
  l._designation={kind,name,colour};
  l.bindPopup(`<div class="pop"><span class="tag" style="background:${colour}1a;color:${colour}">${esc(kind)}</span>
    <h3>${esc(name)}</h3><div class="loading"><span class="spin"></span> Loading details…</div></div>`,
    {minWidth:230, maxWidth:230});
}
/* Per-site overrides: correct Wikipedia titles where the auto-guess hits the wrong
   article, or curated content from a better source (e.g. Somerset Wildlife Trust). */
const SITE_OVERRIDES = {
  "perch":  { wiki:"Perch SSSI" },
  "bourne": { wiki:"Bourne SSSI, Avon" },
  "cheddar complex": {
    img:"https://www.somersetwildlife.org/sites/default/files/styles/large/public/2019-11/DSCN2625_NEF%20Jeff%20Bevan%20%281%29.jpg?itok=IofkS4Wm",
    credit:"Black Rock — Jeff Bevan / Somerset Wildlife Trust",
    text:"Two Somerset Wildlife Trust reserves — Long Wood and Velvet Bottom — make up this roughly 110-hectare complex high in the Mendip Hills near Cheddar Gorge. Long Wood is ash-and-hazel woodland whose floor fills with bluebells, wild garlic and early-purple orchids in spring; Velvet Bottom is a dry valley of unusual lead-tolerant “calaminarian” grassland on old mine spoil, good for adders, lizards and butterflies. Open all year; best April to August.",
    link:"https://www.somersetwildlife.org/nature-reserves/cheddar-complex",
    linkLabel:"More at Somerset Wildlife Trust →" }
};
function siteOverride(name){
  let k=String(name||"").toLowerCase().replace(/\bsssi\b/g,"").replace(/[()]/g," ").replace(/\s+/g," ").trim();
  if(SITE_OVERRIDES[k]) return SITE_OVERRIDES[k];
  k=k.replace(/^the\s+/,"");
  return SITE_OVERRIDES[k]||null;
}
async function enrichDesignation(popup, d){
  const ov=siteOverride(d.name);
  let h=`<div class="pop"><span class="tag" style="background:${d.colour}1a;color:${d.colour}">${esc(d.kind)}</span><h3>${esc(d.name)}</h3>`;
  if(ov && ov.text){                              // curated static content
    if(ov.img) h+=`<img class="pop-hero" src="${esc(ov.img)}" alt="" onerror="this.style.display='none'">`;
    h+=`<p>${esc(ov.text)}</p>`;
    if(ov.credit) h+=`<p class="by">${esc(ov.credit)}</p>`;
    h+=`<a class="link" href="${esc(ov.link)}" target="_blank" rel="noopener">${esc(ov.linkLabel||"Find out more →")}</a>`;
    popup.setContent(h+"</div>"); return;
  }
  const base=d.name.replace(/\s*\(?\s*sssi\s*\)?\s*$/i,"").replace(/\s*local nature reserve$/i,"").trim();
  const titles = (ov && ov.wiki) ? [ov.wiki] : [base, d.name];
  let wiki=null;
  for(const t of titles){
    try{ const r=await fetch("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(t));
      if(r.ok){ const j=await r.json(); if(j && j.extract && j.type!=="disambiguation"){ wiki=j; break; } } }catch(e){}
  }
  const img=wiki?.thumbnail?.source, extract=wiki?.extract, page=wiki?.content_urls?.desktop?.page;
  if(img) h+=`<img class="pop-hero" src="${esc(img)}" alt="">`;
  h+= extract ? `<p>${esc(extract)}</p>`
             : `<p class="by">A designated protected area, mapped from Natural England open data.</p>`;
  h+= page ? `<a class="link" href="${esc(page)}" target="_blank" rel="noopener">More on Wikipedia →</a>`
           : `<a class="link" href="https://www.google.com/search?q=${encodeURIComponent(d.name+" "+d.kind)}" target="_blank" rel="noopener">Search for more →</a>`;
  popup.setContent(h+"</div>");
}
map.on("popupopen", e=>{ const s=e.popup._source;
  if(s && s._designation && !s._enriched){ s._enriched=true; enrichDesignation(e.popup, s._designation); }
  if(s && s._projData){ const el=e.popup.getElement();
    const eb=el && el.querySelector("[data-edit]"); if(eb) eb.onclick=()=>startEdit(eb.getAttribute("data-edit"));
    const db=el && el.querySelector("[data-del]"); if(db) db.onclick=()=>deleteProject(db.getAttribute("data-del")); }
});

function projectPopup(p){
  const photos=(p.photos||[]).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt=""></a>`).join("");
  const canEdit = p.id && (isMine(p.id) || adminMode);
  const controls = canEdit
    ? `<div class="popbtns"><button type="button" class="popbtn" data-edit="${esc(p.id)}">Edit</button>`
      + `<button type="button" class="popbtn danger" data-del="${esc(p.id)}">Delete</button></div>` : "";
  return `<div class="pop"><span class="tag" style="background:#1565C01a;color:#1565C0">Conservation project</span>
    <h3>${esc(p.name)}</h3>${p.description?`<p>${linkify(p.description)}</p>`:""}
    ${p.contributor?`<p class="by">By ${esc(p.contributor)}</p>`:""}
    ${photos?`<div class="photos">${photos}</div>`:""}${controls}</div>`;
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));
// Timeout without AbortController (AbortSignal can't be cloned in some sandboxes)
function timeoutFetch(url, ms){
  return Promise.race([ fetch(url),
    new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")), ms)) ]);
}
async function fetchWithRetry(url,{tries=2,timeout=12000}={}){
  for(let i=0;i<=tries;i++){
    try{
      const r=await timeoutFetch(url, timeout);
      if(r.ok) return await r.json();
      if(r.status===429 && i<tries){ await sleep(1500*(i+1)); continue; }   // throttled → wait & retry
      return null;
    }catch(e){ if(i<tries){ await sleep(700*(i+1)); continue; } throw e; }
  }
  return null;
}
function inatFallback(){
  if(inatTiles) return;                                  // already showing the fallback
  const opts={ maxZoom:20, opacity:.85, attribution:"&copy; iNaturalist" };
  if(PARISH_BB){ try{ opts.bounds=L.latLngBounds([PARISH_BB[1],PARISH_BB[0]],[PARISH_BB[3],PARISH_BB[2]]); }catch(e){} }
  inatTiles=L.tileLayer("https://api.inaturalist.org/v1/points/{z}/{x}/{y}.png", opts);
  if(document.querySelector('[data-lyr="inat"]:checked')) inatTiles.addTo(map);
  const el=document.getElementById("c-inat"); if(el) el.textContent="· shown as layer";
  toast("Wildlife sightings are showing as a map layer — live details couldn't load right now.");
}
const inatShowcase=[]; let showcaseDone=false;
function renderShowcase(){
  const box=document.getElementById("showcase"); if(!box) return;
  if(!inatShowcase.length){ box.hidden=true; return; }
  const pool=inatShowcase.slice();
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  const pick=pool.slice(0,4);
  box.innerHTML='<div class="sc-head">Recent sightings nearby</div>'+pick.map(o=>
    `<a href="${esc(o.uri)}" target="_blank" rel="noopener" title="${esc(o.common)} — by ${esc(o.recorder)}">`
    +`<img src="${esc(o.thumb)}" alt="" loading="lazy" onerror="this.parentNode.style.display='none'">`
    +`<div class="sc-txt"><span class="sc-sp">${esc(o.common)}</span><span class="sc-by">by ${esc(o.recorder)}</span></div></a>`
  ).join("");
  box.hidden=false;
}
function addINatObs(o){
  if(!o.geojson || seen.inat.has(o.id)) return;
  const [lng,lat]=o.geojson.coordinates;
  if(PARISH_BB && (lng<PARISH_BB[0]||lng>PARISH_BB[2]||lat<PARISH_BB[1]||lat>PARISH_BB[3])) return;
  seen.inat.add(o.id);
  const common=o.taxon?.preferred_common_name || o.taxon?.name || "Unknown species";
  const sci=o.taxon?.name||""; const thumb=o.photos?.[0]?.url?.replace("square","small");
  const m=L.circleMarker([lat,lng],{radius:6,color:"#fff",weight:1.5,fillColor:"#E0A52E",fillOpacity:1});
  m.bindPopup(`<div class="pop"><span class="tag" style="background:#E0A52E1a;color:#b9831f">Wildlife sighting</span>
    <h3>${esc(common)}</h3>${sci?`<p class="by"><i>${esc(sci)}</i></p>`:""}
    ${thumb?`<div class="photos"><a href="${esc(o.uri)}" target="_blank" rel="noopener"><img src="${esc(thumb)}" alt=""></a></div>`:""}
    <p class="by">Seen ${esc(o.observed_on||"")} · ${esc(o.user?.login||"someone")}</p>
    <a class="link" href="${esc(o.uri)}" target="_blank" rel="noopener">View on iNaturalist →</a></div>`);
  inatCluster.addLayer(m);
  if(thumb) inatShowcase.push({ common, recorder:(o.user?.name||o.user?.login||"someone"), thumb, uri:o.uri });
}
let inatLoaded=false;
async function loadINat(){
  if(inatLoaded) return;                          // fixed parish box — only need to load once
  // Query a stable box around the parish (not the panned view), so a nearby iNat
  // hotspot like Cheddar Gorge can't crowd out Shipham records in the result cap.
  const bb = PARISH_BB || [SHIPHAM.lng-0.04, SHIPHAM.lat-0.02, SHIPHAM.lng+0.04, SHIPHAM.lat+0.02];
  const W=bb[0], S=bb[1], E=bb[2], N=bb[3];
  const baseU=`https://api.inaturalist.org/v1/observations?nelat=${N}&nelng=${E}`
    +`&swlat=${S}&swlng=${W}&per_page=200&order=desc&order_by=observed_on`
    +`&geo=true&verifiable=true`;
  let got=false;
  for(let page=1; page<=5; page++){             // up to 1000 records in the parish box
    let j;
    try{ j=await fetchWithRetry(baseU+`&page=${page}`); }
    catch(e){ if(page===1){ console.warn("iNaturalist unreachable — using tile fallback.", e); inatFallback(); return; } break; }
    if(!j){ if(page===1){ inatFallback(); return; } break; }
    got=true;
    if(inatTiles){ map.removeLayer(inatTiles); inatTiles=null; }
    const res=j.results||[];
    res.forEach(addINatObs);
    if(res.length<200) break;                   // reached the last page
  }
  if(got){ inatLoaded=true; setCount("c-inat", seen.inat.size);
    if(!showcaseDone && inatShowcase.length){ showcaseDone=true; renderShowcase(); } }
}

/* ---------- Projects ---------- */
/* ---------- Ownership (per-project token in this browser + admin) ---------- */
const OWN_KEY="shipham_my_projects";
function uuid(){ return (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : (Date.now()+"-"+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)); }
function objURL(f){ try{ return URL.createObjectURL(f); }catch(_){ return null; } }
// Load cross-origin JSON via a <script> tag (JSONP) — Apps Script blocks fetch reads, but
// a script-tag read with a ?callback= works fine.
function jsonp(url, timeout=12000){
  return new Promise((resolve,reject)=>{
    const cb="__shipham_cb_"+Math.random().toString(36).slice(2);
    const s=document.createElement("script"); let done=false;
    const cleanup=()=>{ if(s.parentNode) s.parentNode.removeChild(s); try{ delete window[cb]; }catch(_){ window[cb]=undefined; } };
    window[cb]=data=>{ done=true; cleanup(); resolve(data); };
    s.onerror=()=>{ if(!done){ cleanup(); reject(new Error("jsonp failed")); } };
    setTimeout(()=>{ if(!done){ cleanup(); reject(new Error("jsonp timeout")); } }, timeout);
    s.src=url+(url.indexOf("?")>-1?"&":"?")+"callback="+cb+"&t="+Date.now();
    document.body.appendChild(s);
  });
}
function ownStore(){ try{ return JSON.parse(localStorage.getItem(OWN_KEY)||"{}"); }catch(e){ return {}; } }
function rememberOwn(id,token){ try{ const s=ownStore(); s[id]=token; localStorage.setItem(OWN_KEY,JSON.stringify(s)); }catch(e){} }
function myToken(id){ return ownStore()[id]||null; }
function isMine(id){ return !!myToken(id); }
let adminMode=false, adminPass=null;
try{ const ap=sessionStorage.getItem("shipham_admin"); if(ap){ adminPass=ap; adminMode=true; } }catch(e){}
const projectLayers={};
let editId=null, editLayer=null;

const sessionProjects=[];
function addProjectFeature(p){
  if(!p || !p.geom) return;
  try{ projLayer.addData({type:"Feature",geometry:p.geom,
    properties:{id:p.id,name:p.name,description:p.description,contributor:p.contributor,photos:p.photos||[]}}); }
  catch(e){ console.warn("Couldn't draw a project:", e); }
}
let _loadDiagDone=false;
async function loadProjects(){
  let rows=null, how="", note="";
  if(gasReady){
    try{ const r=await fetch(APPS_SCRIPT_URL); const j=await r.json(); if(j&&j.ok){ rows=j.projects||[]; how="fetch"; } }
    catch(e){ note="fetch:"+(e&&e.message||e); }
    if(rows===null){
      try{ const j=await jsonp(APPS_SCRIPT_URL); if(j&&j.ok){ rows=j.projects||[]; how="jsonp"; } }
      catch(e){ note+=" jsonp:"+(e&&e.message||e); }
    }
  } else { rows=sessionProjects; how="session"; }
  if(rows===null){
    if(!_loadDiagDone){ _loadDiagDone=true; toast("Couldn't load projects — "+(note||"no response")); }
    return;
  }
  projLayer.clearLayers(); for(const k in projectLayers) delete projectLayers[k];
  rows.forEach(addProjectFeature);
  setCount("c-projects", rows.length);
  if(!_loadDiagDone){ _loadDiagDone=true; toast("Loaded "+rows.length+" projects via "+how); }
}

/* ---------- Edit / delete a project ---------- */
function startEdit(id){
  const l=projectLayers[id]; if(!l) return;
  if(!gasReady){ toast("Editing needs the Google backend."); return; }
  const p=l._projData||{};
  const isPoint = l.feature && l.feature.geometry && l.feature.geometry.type==="Point";
  map.closePopup();
  editId=id; editLayer=l;
  if(!isPoint){ try{ l.editing.enable(); }catch(e){} }
  try{ if(isPoint) map.setView(l.getLatLng(), Math.max(map.getZoom(),16));
       else map.fitBounds(l.getBounds(),{padding:[60,60],maxZoom:17}); }catch(e){}
  document.getElementById("f-name").value=p.name||"";

  scrim.classList.add("show"); drawer.classList.add("show");
}
async function deleteProject(id){
  if(!gasReady){ toast("Deleting needs the Google backend."); return; }
  if(!confirm("Delete this project? This can't be undone.")) return;
  try{
    try{ await fetch(APPS_SCRIPT_URL,{ method:"POST", body:JSON.stringify({ action:"delete", id, token:myToken(id), admin:adminPass }) }); }
    catch(err){ /* reply blocked cross-origin; the delete already happened server-side */ }
    const l=projectLayers[id]; if(l){ projLayer.removeLayer(l); delete projectLayers[id]; }  // optimistic
    toast("Project deleted."); map.closePopup(); loadProjects();
  }catch(e){ console.error(e); toast("Couldn't delete just now — please try again."); }
}

function redrawDrawPreview(){

    drawPts.forEach(ll=> L.circleMarker(ll,{radius:5,color:"#fff",weight:2,fillColor:"#1565C0",fillOpacity:1}).addTo(drawDots)); }

function clearDrawPreview(){
  if(drawPreview){ map.removeLayer(drawPreview); drawPreview=null; }

  if(n===2){ toast("Use 1 point for a single spot, or add a 3rd for an area."); return; }
  const pts=drawPts.slice(); clearDrawPreview();

    try{ map.setView(pts[0], Math.max(map.getZoom(),16)); }catch(e){}

    tempLayer=L.polygon(pts,{color:"#1565C0",weight:2.5,fillColor:"#2196F3",fillOpacity:.28}).addTo(map);
    try{ map.fitBounds(tempLayer.getBounds(),{padding:[60,60],maxZoom:17}); }catch(e){}

function renderThumbs(){ const box=document.getElementById("thumbs"); box.innerHTML="";
  photoFiles.forEach((f,i)=>{ const url=URL.createObjectURL(f); const fig=document.createElement("figure");
    fig.innerHTML=`<img src="${url}" alt=""><button type="button" aria-label="Remove photo">×</button>`;
    fig.querySelector("button").onclick=()=>{ photoFiles.splice(i,1); renderThumbs(); }; box.appendChild(fig); }); }

function resizeImage(file,max=1600,q=.82){ return new Promise(res=>{ const img=new Image();
  img.onload=()=>{ let {width:w,height:h}=img; if(w>max||h>max){ const s=Math.min(max/w,max/h); w=Math.round(w*s); h=Math.round(h*s); }
    const c=document.createElement("canvas"); c.width=w; c.height=h; c.getContext("2d").drawImage(img,0,0,w,h);
    c.toBlob(b=>res(b||file),"image/jpeg",q); }; img.onerror=()=>res(file); img.src=URL.createObjectURL(file); }); }
const blobToDataURL = b => new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.onerror=()=>r(null); fr.readAsDataURL(b); });

let _submitting=false;
async function submitProject(){
  if(_submitting) return;
  const name=document.getElementById("f-name").value.trim();
  const desc=document.getElementById("f-desc").value.trim();
  const by  =document.getElementById("f-by").value.trim();
  if(!name||!desc){ toast("Please add a name and a short description."); return; }
  const editing=!!editId, targetId=editId;
  let geom;
  if(editing){ try{ geom=editLayer.toGeoJSON().geometry; }catch(_){ } }
  else { if(!tempLayer){ toast("Please draw your project area on the map first."); return; } geom=tempLayer.toGeoJSON().geometry; }
  const files=photoFiles.slice();
  _submitting=true;
  closeForm();                        // return to the map straight away
  toast(editing ? "Saving changes…" : "Saving your project…");
  try{
    if(gasReady){
      const newId=uuid(), newToken=uuid();
      if(!editing){ rememberOwn(newId, newToken);
        addProjectFeature({ id:newId, name, description:desc, contributor:by||null, geom, photos:files.map(objURL).filter(Boolean) }); }
      toast(editing ? "Your changes are saved." : "Thank you — your project is now on the map.");
      // Everything that can fail (photo encoding + the cross-origin write) runs in the
      // background, so it can never surface as a false "saving failed". The write executes
      // server-side even though the browser is blocked from reading the reply.
      (async ()=>{
        const photos=[];
        for(const f of files){ try{ const d=await blobToDataURL(await resizeImage(f)); if(d) photos.push(d); }catch(_){ } }
        const body = editing
          ? { action:"update", id:targetId, token:myToken(targetId), admin:adminPass, name, description:desc, contributor:by||null, geom, photos }
          : { id:newId, token:newToken, name, description:desc, contributor:by||null, geom, photos };
        // A simple POST reaches Apps Script and writes the row *before* the browser's CORS
        // check rejects the unreadable reply — so the throw here is expected and harmless.
        try{ await fetch(APPS_SCRIPT_URL,{ method:"POST", body:JSON.stringify(body) }); }
        catch(err){ /* reply blocked cross-origin; the write already happened server-side */ }
        loadProjects();
      })();
    } else {
      sessionProjects.unshift({name,description:desc,contributor:by||null,geom,photos:files.map(f=>URL.createObjectURL(f))});
      toast("Added in preview. Connect storage (README) to share it.");
      await loadProjects();
    }
  }catch(err){ console.error(err); toast("Sorry — saving failed. Please try again."); if(editing) loadProjects(); }
  finally{ _submitting=false; }
}
drawer.addEventListener("submit", e=>{ e.preventDefault(); submitProject(); });
document.getElementById("saveBtn").addEventListener("click", e=>{ e.preventDefault(); submitProject(); });

/* =================================================================
   LAYER ENGINE — builds, lazily fetches and styles each layer.
================================================================= */
const _pal=["#C0CA33","#FBC02D","#FB8C00","#8D6E63","#6D4C41","#5C6BC0","#7E57C2","#AB47BC",
            "#EC407A","#26C6DA","#42A5F5","#78909C","#A1887F","#D4E157","#66BB6A"];
const _palMap={}; let _palI=0;
function habColor(name){
  name=String(name||"—");
  if(/wood|tree|copse|forest/i.test(name)) return "#2E7D32";
  if(/heath/i.test(name))                  return "#9C4D9C";
  if(/grass|meadow|pasture/i.test(name))   return "#C9B037";
  if(/fen|marsh|mire|bog|wet|water/i.test(name)) return "#3DA5C4";
  if(/orchard/i.test(name))                return "#EF6C00";
  if(!(name in _palMap)){ _palMap[name]=_pal[_palI%_pal.length]; _palI++; }
  return _palMap[name];
}
const HIDE=/^(fill|cat|OBJECTID|GlobalID|Shape|FID|Easting|Northing|CaptureScale|UID|Version|THEMID|THEME|PERIMETER|X_COORD|Y_COORD|ListEntry|HYPERLINK|REF_CODE|MEASURE|LABEL|HabCodes|SHAPE_|objectid|hyperlink|gml_id|ogc_fid|Incid|Habdefver|PriDet|Descrip|UNIQUEID|MAPPINGARE|CACHAIR|ISSU|LATITUDE|LONGITUDE|GRID_REF|SAC_CODE|NGR|ROW_ID|SHAPE|InterQual|S\d|Orch|Habdef|Mapped|Confid|bus|Created|LastEdit|Last_Edit|NonTO|Globalid|Verified|Modified)/i;
/* Values arrive as raw tags, epoch milliseconds and long floats; make them readable. */
function prettyVal(k,v){
  if(typeof v==="number"){
    if(Math.abs(v)>1e11 && Math.abs(v)<4e12)        // epoch milliseconds
      return new Date(v).toLocaleDateString("en-GB",{year:"numeric",month:"long",day:"numeric"});
    return (Math.round(v*100)/100).toLocaleString("en-GB");
  }
  const t=String(v).trim();
  if(/^[a-z][a-z0-9_]*$/.test(t)) return t.replace(/_/g," ").replace(/^./,c=>c.toUpperCase());
  return t;
}
const KEYNAME={AreaHa:"Area (ha)",area_ha:"Area (ha)",AREA:"Area (ha)",SAC_AREA:"Area (ha)",
  MainHabs:"Habitat",THEMNAME:"Type",Prihabtxt:"Habitat",CL_NUMBER:"Common land no.",
  MAPSTATUS:"Status",AUTHORITY:"Authority",DATESIGNED:"Registered",OC:"Open country",
  RCL:"Registered common",S16:"Dedicated land",man_made:"Structure",tourism:"Visitor",
  leisure:"Facility",religion:"Religion",denomination:"Denomination",sport:"Sport",
  species:"Species",operator:"Run by",access:"Access",ele:"Height (m)",start_date:"Dated",
  PrimSource:"Source",ROW_TYPE:"Path",SchedDate:"Scheduled",ListDate:"Listed",Grade:"Grade",
  CONTACT_NO:"Contact",STATUS:"Status",natural:"Feature",amenity:"Type",historic:"Historic",shop:"Shop",highway:"Transport",
  waterway:"Watercourse",place:"Place"};
const prettyKey = k => KEYNAME[k] || k.replace(/_/g," ").replace(/\b\w/g,c=>c.toUpperCase())
                        .replace(/\bUrl\b/i,"Link").replace(/\bHab\b/i,"Habitat");
const TAGKEYS=["natural","historic","amenity","highway","leisure","man_made","tourism","shop","waterway","place"];
const prettyTag = v => String(v).trim().replace(/_/g," ").replace(/^./,c=>c.toUpperCase());
const isTag = v => /^[a-z][a-z0-9_]*$/.test(String(v).trim());
function titleOf(def,p){
  for(const k of (def.n||[])) if(p[k] && String(p[k]).trim())
    return isTag(p[k]) ? prettyTag(p[k]) : tidyName(p[k]);
  for(const k of ["name","Name","NAME"]) if(p[k] && String(p[k]).trim()) return tidyName(p[k]);
  for(const k of TAGKEYS) if(p[k]) return prettyTag(p[k]);   // "cave_entrance" -> "Cave entrance"
  return def.t;
}
function featurePopup(def,p){
  const title=titleOf(def,p);
  let rows="";
  let n=0;
  for(const k in p){
    if(HIDE.test(k) || n>=7) continue;
    const v=p[k]; if(v==null||String(v).trim()==="") continue;
    if(/^(-|n\/?a|none|unknown|not done|not applicable|tbc|null)$/i.test(String(v).trim())) continue;
    const pv=prettyVal(k,v);
    if(String(pv).toLowerCase()===String(title).toLowerCase()) continue;
    rows+=`<div style="margin-top:3px"><b style="color:var(--muted);font-weight:600">${esc(prettyKey(k))}:</b> ${linkify(pv)}</div>`;
    n++;
  }
  const link = def.link && p[def.link] ? `<div style="margin-top:7px"><a href="${esc(p[def.link])}" target="_blank" rel="noopener">More detail →</a></div>` : "";
  return `<div class="pop"><span class="tag" style="background:${def.c}1a;color:${def.c}">${esc(def.t)}</span>
    <h3>${esc(title)}</h3><div style="font-size:.78rem;line-height:1.45">${rows}</div>${link}</div>`;
}
const isPoint = f => !!(f && f.geometry && /Point$/.test(f.geometry.type));
function styleFor(def){
  return f=>{
    // Points keep the pane and size pointToLayer gave them; only their colour is ours.
    if(isPoint(f)) return {pane:"linePane",color:"#fff",weight:1.6,fillColor:def.c,fillOpacity:1};
    if(def.kind==="line") return {pane:"linePane",color:def.c,weight:3,opacity:.95,dashArray:def.dash||null,fill:false};
    if(def.kind==="wash"){ const p=f.properties||{};
      const col = def.fillProp&&p[def.fillProp] ? p[def.fillProp]
                : (def.colorBy ? habColor(def.colorBy.map(k=>p[k]).find(Boolean)) : def.c);
      return {pane:"fillPane",stroke:false,fillColor:col,fillOpacity:.55}; }
    return {pane:"areaPane",color:def.c,weight:2,fillColor:def.c,fillOpacity:def.faint?.07:.18};
  };
}
/* One canvas per pane, with a tap tolerance — a 4px dot is otherwise almost
   impossible to hit with a finger. */
const paneOf = d => d.kind==="wash" ? "fillPane" : (d.kind==="area" ? "areaPane" : "linePane");
const RENDERERS={};
const rendererFor = pane => RENDERERS[pane] ||
  (RENDERERS[pane]=L.canvas({pane:pane, tolerance: pane==="linePane" ? 10 : 4}));
/* Attribution is a licence condition for several of these sources — OpenStreetMap's
   ODbL in particular requires it — so each layer carries its own credit. */
const ATTRIB={
  osm:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors (ODbL)',
  ne:'&copy; Natural England (OGL v3)', he:'&copy; Historic England (OGL v3)',
  fc:'&copy; Forestry Commission (OGL v3)', sc:'Rights of way &copy; Somerset Council'
};
const NE_IDS=["sssi","lnr","nnr","sac","priority-habitats","ancient-woodland","orchards",
              "wood-pasture","open-access","common-land","national-landscape","nature-projects"];
const HE_IDS=["listed-buildings","listed-building-areas","scheduled-monuments","conservation-areas"];
function attribFor(id,d){
  if(d.attribution) return d.attribution;
  if(id.startsWith("osm-")) return ATTRIB.osm;
  if(NE_IDS.includes(id))   return ATTRIB.ne;
  if(HE_IDS.includes(id))   return ATTRIB.he;
  if(id==="tree-groups"||id==="woodland-nfi") return ATTRIB.fc;
  if(id==="prow")           return ATTRIB.sc;
  return undefined;
}
/* The Somerset HER service only speaks EPSG:27700, so proj4 is fetched the first time
   one of its layers is switched on rather than on every visit. */
let _bngReady=null;
function ensureBNG(){
  if(_bngReady) return _bngReady;
  _bngReady=(async()=>{
    await loadScript(["https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js",
                      "https://cdn.jsdelivr.net/npm/proj4@2.11.0/dist/proj4.js"]);
    await loadScript(["https://cdn.jsdelivr.net/npm/proj4leaflet@1.0.2/src/proj4leaflet.min.js",
                      "https://unpkg.com/proj4leaflet@1.0.2/src/proj4leaflet.js"]);
    L.CRS.EPSG27700 = new L.Proj.CRS("EPSG:27700",
      "+proj=tmerc +lat_0=49 +lon_0=-2 +k=0.9996012717 +x_0=400000 +y_0=-100000 +ellps=airy "
      +"+towgs84=446.448,-125.157,542.06,0.15,0.247,0.842,-20.489 +units=m +no_defs",
      { resolutions:[896,448,224,112,56,28,14,7,3.5,1.75,0.875,0.4375,0.21875,0.109375],
        origin:[-238375,1376256] });
  })();
  return _bngReady;
}
const built={}, loaded={}, loading={};
function layerOf(id){
  if(built[id]) return built[id];
  const d=LAYERS[id];
  if(d.kind==="inat")     return built[id]=inatCluster;
  if(d.kind==="projects") return built[id]=projLayer;
  if(d.kind==="wms"){
    const o={layers:d.wms,format:"image/png",transparent:true,version:"1.1.1",pane:"wmsPane",
             opacity:d.opacity||.6,maxZoom:20,attribution:d.attribution||""};
    if(d.srs==="27700") o.crs=L.CRS.EPSG27700;
    if(d.bounds) o.bounds=L.latLngBounds(d.bounds);
    return built[id]=L.tileLayer.wms(d.url,o);
  }
  const gj=L.geoJSON(null,{
    pane: paneOf(d),
    renderer: rendererFor(paneOf(d)),
    attribution: attribFor(id,d),
    style: styleFor(d),
    pointToLayer:(f,ll)=>L.circleMarker(ll,{pane:"linePane",renderer:rendererFor("linePane"),
                          radius:d.small?5:7,color:"#fff",weight:1.6,fillColor:d.c,fillOpacity:1}),
    onEachFeature:(f,l)=>{
      const p=f.properties||{};
      if(d.designation) bindDesignation(f,l,d.designation,d.c);
      else l.bindPopup(featurePopup(d,p),{minWidth:210,maxWidth:260});
    }
  });
  built[id]= d.cluster ? L.markerClusterGroup({maxClusterRadius:50,showCoverageOnHover:false}) : gj;
  built[id]._gj = gj;
  return built[id];
}
async function fetchLayer(id){
  const d=LAYERS[id];
  if(!d.f || loaded[id] || loading[id]) return;
  loading[id]=true;
  const el=document.getElementById("c-"+id); if(el) el.innerHTML='<span class="spin-sm"></span>';
  try{
    const r=await fetch(DATA+d.f+".geojson");
    if(!r.ok) throw new Error("HTTP "+r.status);
    const j=await r.json();
    const lyr=layerOf(id); const target=lyr._gj||lyr;
    target.addData(j);
    if(lyr._gj && lyr!==lyr._gj) lyr.addLayer(lyr._gj);
    loaded[id]=true;
    setCount("c-"+id,(j.features||[]).length);
    if(CURRENT && CURRENT.highlight && CURRENT.highlight.layer===id) renderHighlights(CURRENT);
  }catch(e){
    console.warn("Layer failed:",id,e);
    setCount("c-"+id,null); toast("Couldn't load “"+d.t+"”.");
  }finally{ loading[id]=false; }
}
function setLayer(id,on){
  const d0=LAYERS[id];
  if(on && d0.srs==="27700" && !L.CRS.EPSG27700){
    const el=document.getElementById("c-"+id); if(el) el.innerHTML='<span class="spin-sm"></span>';
    ensureBNG().then(()=>{
      const cb=document.querySelector('[data-lyr="'+id+'"]');
      if(cb && cb.checked){ map.addLayer(layerOf(id)); setCount("c-"+id,null); if(el) el.textContent="· on"; }
      else if(el) el.textContent="";
    }).catch(e=>{ console.warn("British National Grid support failed",e);
      toast("Couldn't load the historic map layer."); setCount("c-"+id,null); });
    return;
  }
  const lyr=layerOf(id);
  if(on){
    map.addLayer(lyr);
    if(LAYERS[id].kind==="inat"){ if(inatTiles) map.addLayer(inatTiles); loadINat(); }
    else if(LAYERS[id].kind==="projects") loadProjects();
    else fetchLayer(id);
  } else {
    map.removeLayer(lyr);
    if(LAYERS[id].kind==="inat" && inatTiles) map.removeLayer(inatTiles);
  }
}

function renderHighlights(g){
  const hi=g.highlight, box=$("sidebox"), list=$("sidelist");
  if(!hi || !loaded[hi.layer]){ box.hidden=true; return; }
  const lyr=built[hi.layer]; const gj=lyr._gj||lyr;
  const seen=new Set(); const items=[];
  gj.eachLayer(l=>{
    const p=(l.feature&&l.feature.properties)||{};
    const nm=(hi.name||[]).map(k=>p[k]).find(Boolean);
    if(!nm) return;
    if(/^[a-z0-9_]+$/.test(String(nm))) return;   // a raw OSM tag, not a name
    const t=tidyName(nm); if(seen.has(t)) return; seen.add(t);
    let sub=(hi.sub||[]).map(k=>p[k]).find(Boolean);
    if(sub && hi.subPrefix) sub=hi.subPrefix+sub;
    items.push({t,sub,l});
  });
  if(!items.length){ box.hidden=true; return; }
  items.sort((a,b)=>a.t.localeCompare(b.t));
  $("sideboxTitle").textContent=hi.title||"Highlights";
  list.innerHTML="";
  items.slice(0,60).forEach(it=>{
    const b=document.createElement("button");
    b.innerHTML=esc(it.t)+(it.sub?`<span class="m">${esc(prettyKey(String(it.sub)))}</span>`:"");
    b.addEventListener("click",()=>{
      try{ const t=it.l.getBounds?it.l.getBounds():null;
        if(t&&t.isValid()) map.fitBounds(t,{padding:[70,70],maxZoom:17});
        else if(it.l.getLatLng) map.setView(it.l.getLatLng(),17);
      }catch(e){}
      it.l.openPopup&&it.l.openPopup();
    });
    list.appendChild(b);
  });
  box.hidden=false;
}
function clearGroup(){

function buildSwitcher(){

/* ---------- Parish boundary (always drawn) ---------- */
function fitParish(){
  try{ map.fitBounds(L.geoJSON(parishFeature).getBounds(),{padding:[40,40],maxZoom:15}); }catch(e){}
}
async function loadParish(){
  try{
    const r=await fetch(DATA+"parish.geojson"); const gj=await r.json();
    parishFeature=gj.features[0];
    const rings=[];
    (function walk(c,d){ if(d===0){ rings.push(c); return; } c.forEach(x=>walk(x,d-1)); })(
      parishFeature.geometry.coordinates, parishFeature.geometry.type==="Polygon" ? 1 : 2);
    const outline={type:"Feature",properties:{},geometry:{type:"MultiLineString",coordinates:rings}};
    L.geoJSON(outline,{pane:"linePane",interactive:false,
      style:{color:"#ffffff",weight:6,opacity:.85}}).addTo(parishGroup);
    L.geoJSON(outline,{pane:"linePane",style:{color:"#8E4A77",weight:3,opacity:1,dashArray:"9 6"}})
      .bindTooltip("Shipham civil parish (Shipham, Rowberrow &amp; Star)").addTo(parishGroup);
    let W=180,S=90,E=-180,N=-90;
    (function walk(c){ if(typeof c[0]==="number"){ W=Math.min(W,c[0]);E=Math.max(E,c[0]);S=Math.min(S,c[1]);N=Math.max(N,c[1]); }
      else c.forEach(walk); })(parishFeature.geometry.coordinates);
    const dx=1.5/(111.32*Math.cos(51.31*Math.PI/180)), dy=1.5/110.57;
    PARISH_BB=[W-dx,S-dy,E+dx,N+dy];
  }catch(e){ console.warn("Parish boundary failed",e); }
}

  const d=document.createElement("div");
  d.style.cssText="position:fixed;left:8px;bottom:8px;z-index:99999;max-width:94vw;background:rgba(255,255,255,.97);"
    +"border:2px solid #D81B83;border-radius:10px;padding:10px 12px;font:13px/1.45 ui-monospace,Menlo,monospace;"
    +"white-space:pre;overflow:auto;max-height:70vh;box-shadow:0 6px 20px rgba(0,0,0,.25)";
  const txt=lines.map(x=>(x[0]+"                    ").slice(0,21)+" : "+x[1]).join("\n");
  d.textContent=txt;
  const btn=document.createElement("button");
  btn.textContent="Copy"; btn.style.cssText="display:block;margin-top:8px;font:600 14px system-ui;padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#fff";
  btn.onclick=()=>{ navigator.clipboard && navigator.clipboard.writeText(txt).then(()=>alert("Copied")); };
  d.appendChild(btn); document.body.appendChild(d);
},2500));

/* ================= BOOTSTRAP: Leaflet + marker clustering ================= */
function loadScript(urls){
  return new Promise((resolve,reject)=>{ let i=0;
    (function next(){ if(i>=urls.length){ reject(new Error("Failed to load "+urls[0])); return; }
      const s=document.createElement("script"); s.src=urls[i++];
      s.onload=resolve; s.onerror=()=>{ s.remove(); next(); }; document.head.appendChild(s);
    })();
  });
}
(async()=>{
  try{
    await loadScript([
      "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js",
      "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js",
      "https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"]);
    await loadScript([
      "https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js",
      "https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js",
      "https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"]);
    initApp();
  }catch(err){
    console.error(err);
    document.getElementById("map").innerHTML =
      '<div class="loadfail"><h2>Map couldn\'t load</h2><p style="color:#5B6A60">The mapping libraries didn\'t download. '
      +'Check your internet connection and refresh the page.</p></div>';
  }
})();

</script>
